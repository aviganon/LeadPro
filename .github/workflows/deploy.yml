name: Deploy LeadPro to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: me-west1
  SERVICE_NAME: leadpro
  IMAGE: gcr.io/${{ secrets.GCP_PROJECT_ID }}/leadpro

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker --quiet

      # Build args מטמיעים NEXT_PUBLIC_* בתוך ה-client bundle — חובה ש-Secrets ב-GitHub יהיו מלאים לפני deploy
      - name: Build Docker image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_FIREBASE_API_KEY="${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN="${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID="${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET="${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID="${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_APP_ID="${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}" \
            --build-arg NEXT_PUBLIC_FACEBOOK_APP_ID="${{ secrets.NEXT_PUBLIC_FACEBOOK_APP_ID }}" \
            --build-arg NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY="${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}" \
            -t ${{ env.IMAGE }}:${{ github.sha }} \
            -t ${{ env.IMAGE }}:latest \
            .

      - name: Push to Container Registry
        run: |
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.IMAGE }}:${{ github.sha }} \
            --platform managed \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 10 \
            --timeout 60 \
            --set-env-vars "^|^NODE_ENV=production|NEXTAUTH_URL=https://apexleads.vip|LEAD_RSS_FEED_URLS=${{ vars.LEAD_RSS_FEED_URLS }}" \
            --set-secrets "\
              FACEBOOK_APP_SECRET=FACEBOOK_APP_SECRET:latest,\
              NEXTAUTH_SECRET=NEXTAUTH_SECRET:latest,\
              ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest,\
              STRIPE_SECRET_KEY=STRIPE_SECRET_KEY:latest,\
              STRIPE_WEBHOOK_SECRET=STRIPE_WEBHOOK_SECRET:latest,\
              TELEGRAM_BOT_TOKEN=TELEGRAM_BOT_TOKEN:latest,\
              TOKEN_ENCRYPTION_KEY=TOKEN_ENCRYPTION_KEY:latest"

      - name: Get Service URL
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region ${{ env.REGION }} \
            --format 'value(status.url)')
          echo "Deployed to: $URL"

      - name: Deploy Firestore Rules + Hosting
        # Hosting only rewrites all traffic to the Cloud Run service, so the live
        # site already serves the latest app from the Cloud Run deploy above.
        # The hosting deploy is just a CDN-cache purge.
        run: |
          npm install -g firebase-tools
          # החוקים/אינדקסים קודם (קריטי) — אם זה נכשל, הפריסה צריכה להיכשל.
          firebase deploy --only firestore:rules,firestore:indexes \
            --project ${{ env.PROJECT_ID }} \
            --token "${{ secrets.FIREBASE_TOKEN }}"
          # ה-Hosting מפנה הכול ל-Cloud Run, ולכן כשהקונפיג לא משתנה Firebase מחזיר
          # "supplied version is the current active version" — שגיאה שפירושה שהאתר
          # כבר מעודכן. סופגים רק אותה; כל שגיאה אחרת מפילה את הפריסה.
          set +e
          OUT=$(firebase deploy --only hosting --project ${{ env.PROJECT_ID }} --token "${{ secrets.FIREBASE_TOKEN }}" 2>&1)
          CODE=$?
          echo "$OUT"
          if [ $CODE -ne 0 ]; then
            echo "$OUT" | grep -q "is the current active version" \
              && echo "ℹ Hosting already at current version — no-op, treating as success." \
              || exit $CODE
          fi
